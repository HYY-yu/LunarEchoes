name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Ensure the frozen battle baseline is available
        run: |
          if ! git cat-file -e bde5936d13d6890a72d24d36bb0039e48e36df44:src/core.ts; then
            git fetch --no-tags --depth=1 origin bde5936d13d6890a72d24d36bb0039e48e36df44
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - name: Compare the fixed diagnostic prefix at Node 24.21.0
        run: |
          node scripts/replay-diagnostic.mjs capture /tmp/lunar-checksum-trace.json 24.21.0
          node scripts/replay-diagnostic.mjs compare docs/evidence/desert34/macos-node24.21.0.json /tmp/lunar-checksum-trace.json
      - name: Record the full fixed terminal at Node 24.21.0
        env:
          LUNAR_FULL_TERMINAL: '1'
        run: node --test --test-reporter=tap --test-name-pattern='^the real desert run matches the frozen engine on this platform at every captured action$' test/desert-replay.test.mjs
